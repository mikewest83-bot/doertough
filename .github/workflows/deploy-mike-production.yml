name: Validate Mike AI Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mike-ai-production-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply production SDP patch
        run: node scripts/patch-realtime-sdp.mjs

      - name: Build
        run: npm run build

      - name: Verify build is idempotent
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/mike-ai-build-1.diff
          npm run build
          git diff --binary > /tmp/mike-ai-build-2.diff
          cmp -s /tmp/mike-ai-build-1.diff /tmp/mike-ai-build-2.diff || {
            echo 'Build is not idempotent.'
            diff -u /tmp/mike-ai-build-1.diff /tmp/mike-ai-build-2.diff || true
            exit 1
          }

      - name: Test
        run: npm test

      - name: Validation summary
        run: |
          echo "Validated commit: $GITHUB_SHA"
          echo "Railway production deployment is handled by the connected Railway GitHub integration."
