name: Wire Mike Memory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[memory-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire persistent memory into API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/index.mjs')
          s = p.read_text()
          marker = "// === MIKE_MEMORY_WIRED_V1 ==="
          if marker in s:
              print('Memory already wired.')
              raise SystemExit(0)

          old_import = "import { MIKE_INSTRUCTIONS } from './persona.mjs';"
          new_import = old_import + "\nimport { getRelevantMemories, listMemories, saveMemory, deleteMemory, memoryPrompt, CATEGORIES } from './memory.mjs';"
          if old_import not in s:
              raise SystemExit('persona import not found')
          s = s.replace(old_import, new_import, 1)

          old = "const instructions = owner ? MIKE_INSTRUCTIONS : MIKE_INSTRUCTIONS + NON_OWNER_NOTE;"
          new = """const relevantMemories = req.user ? await getRelevantMemories(req.user.id, message, 12) : [];
          const memoryContext = memoryPrompt(relevantMemories);
          const instructions = (owner ? MIKE_INSTRUCTIONS : MIKE_INSTRUCTIONS + NON_OWNER_NOTE) + memoryContext;"""
          if old not in s:
              raise SystemExit('ask instructions anchor not found')
          s = s.replace(old, new, 1)

          ask_anchor = "// TTS + optional lip-sync"
          memory_routes = r'''// === MIKE_MEMORY_WIRED_V1 ===
          // Persistent, account-scoped memory. Memory is deliberately separate
          // from the core persona and can be viewed or deleted by the account.
          app.get('/api/memory', authRequired, async (req, res) => {
            try {
              const category = req.query?.category ? String(req.query.category) : undefined;
              res.json({ memories: await listMemories(req.user.id, { category }) });
            } catch (err) {
              console.error('[memory] list failed:', err.message || err);
              res.status(500).json({ error: 'memory_unavailable' });
            }
          });

          app.post('/api/memory', authRequired, async (req, res) => {
            try {
              const category = String(req.body?.category || 'context');
              const memory = String(req.body?.memory || '').trim();
              if (!memory) return res.status(400).json({ error: 'memory_required' });
              if (!CATEGORIES.has(category)) return res.status(400).json({ error: 'memory_category_invalid' });
              const saved = await saveMemory(req.user.id, {
                category,
                memory,
                importance: req.body?.importance,
                source: req.body?.source || 'user'
              });
              res.json({ memory: saved });
            } catch (err) {
              console.error('[memory] save failed:', err.message || err);
              res.status(500).json({ error: 'memory_save_failed' });
            }
          });

          app.delete('/api/memory/:id', authRequired, async (req, res) => {
            try {
              const deleted = await deleteMemory(req.user.id, req.params.id);
              res.json({ deleted });
            } catch (err) {
              console.error('[memory] delete failed:', err.message || err);
              res.status(500).json({ error: 'memory_delete_failed' });
            }
          });

          '''
          if ask_anchor not in s:
              raise SystemExit('tts anchor not found')
          s = s.replace(ask_anchor, memory_routes + ask_anchor, 1)

          p.write_text(s)
          print('Mike Memory v1 wired into API.')
          PY

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Wire Mike Memory v1 [memory-wired]"
          git push
