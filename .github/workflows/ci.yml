name: Mike AI CI

on:
  push:
    branches: [main, mike-ai-clean-integration]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Persist generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message != 'chore: add reproducible npm lockfile [skip ci]'
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain -- package-lock.json | grep -q '^$'; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile [skip ci]"
          git push
      - name: Apply production SDP patch
        run: node scripts/patch-realtime-sdp.mjs
      - name: Build
        run: npm run build
      - name: Verify build is idempotent
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/mike-ai-build-1.diff
          npm run build
          git diff --binary > /tmp/mike-ai-build-2.diff
          if ! cmp -s /tmp/mike-ai-build-1.diff /tmp/mike-ai-build-2.diff; then
            echo "Build is not idempotent: the second build changed tracked files differently from the first build."
            diff -u /tmp/mike-ai-build-1.diff /tmp/mike-ai-build-2.diff || true
            exit 1
          fi
      - name: Test
        run: npm test
