name: Enable Mike Realtime Voice

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-realtime:
    if: ${{ !contains(github.event.head_commit.message, 'Wire Mike realtime voice') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wire realtime server and client
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('server/index.mjs')
          text = index.read_text()

          if "./speech-engine.mjs" not in text:
              text = text.replace(
                  "import express from 'express';\n",
                  "import express from 'express';\nimport http from 'http';\n"
              )
              text = text.replace(
                  "import { migrate } from './db.mjs';\n",
                  "import { migrate } from './db.mjs';\nimport { initializeSpeechEngine, getSpeechEngineToken } from './speech-engine.mjs';\n"
              )
              marker = "// ===== Routes =====\n"
              route = """// ===== Realtime voice =====\napp.get('/api/speech/token', optionalAuth, async (req, res) => {\n  try {\n    const result = await getSpeechEngineToken();\n    res.json(result);\n  } catch (err) {\n    console.error('[speech-engine] token failed:', err.message || err);\n    res.status(err.status || 502).json({ error: err.message || 'speech_engine_unavailable' });\n  }\n});\n\n"""
              if marker in text:
                  text = text.replace(marker, route + marker, 1)
              old = """app.listen(PORT, () => {\n  console.log(`[mike-ai] listening on port ${PORT}`);\n  console.log(`[mike-ai] openai: ${!!process.env.OPENAI_API_KEY}`);\n  console.log(`[mike-ai] elevenlabs: ${!!process.env.ELEVENLABS_API_KEY}`);\n  console.log(`[mike-ai] fal: ${!!process.env.FAL_KEY}`);\n  console.log(`[mike-ai] accounts: ${authConfigured()}`);\n});"""
              new = """const server = http.createServer(app);\n\nserver.listen(PORT, async () => {\n  console.log(`[mike-ai] listening on port ${PORT}`);\n  console.log(`[mike-ai] openai: ${!!process.env.OPENAI_API_KEY}`);\n  console.log(`[mike-ai] elevenlabs: ${!!process.env.ELEVENLABS_API_KEY}`);\n  console.log(`[mike-ai] fal: ${!!process.env.FAL_KEY}`);\n  console.log(`[mike-ai] accounts: ${authConfigured()}`);\n  try {\n    const engineId = await initializeSpeechEngine(server);\n    console.log(`[mike-ai] realtime voice ready: ${engineId || 'disabled'}`);\n  } catch (err) {\n    console.error('[mike-ai] realtime voice initialization failed:', err.message || err);\n  }\n});"""
              if old not in text:
                  raise SystemExit('Expected app.listen block not found; refusing to modify server/index.mjs')
              text = text.replace(old, new, 1)
              index.write_text(text)

          html = Path('index.html')
          h = html.read_text()
          script = '<script type="module" src="/src/realtime-voice.js"></script>'
          if script not in h:
              h = h.replace('<script type="module" src="/src/main.jsx"></script>', '<script type="module" src="/src/main.jsx"></script>' + script)
              html.write_text(h)
          PY

      - name: Commit realtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.mjs index.html
          git diff --cached --quiet && exit 0
          git commit -m "Wire Mike realtime voice"
          git push
