name: Mike AI Fold Build Patches

on:
  push:
    branches: [mike-ai-hardening]

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run current production build once
        run: npm run build
      - name: Show generated source changes
        run: git status --short
      - name: Commit generated canonical source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.mjs src/main.jsx package-lock.json
          if git diff --cached --quiet; then
            echo "No generated source changes to commit"
            exit 0
          fi
          git commit -m "refactor: fold production build patches into source"
          git push
